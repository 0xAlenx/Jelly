server {
    listen 80;
    server_name app.jellyai.cloud;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.jellyai.cloud;

    root /var/www/jellyai-app;
    index index.html;

    ssl_certificate /etc/nginx/ssl/app.jellyai.cloud.crt;
    ssl_certificate_key /etc/nginx/ssl/app.jellyai.cloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Hermes APIs and Socket.IO remain on the temporary execution node.
    # Static UI files are served from this cloud server so the app opens
    # quickly even when the execution-node network has higher latency.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18650;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:18650;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /jellyai-demo.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /jellyai-demo.css {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
